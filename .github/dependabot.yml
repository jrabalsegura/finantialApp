# Actualizaciones de dependencias (ver docs/DEPLOY.md, §12 "Mantenimiento").
# - Seguridad: un PR en cuanto hay aviso, agrupado por ecosistema.
# - Menores y parches: un PR agrupado al mes por ecosistema.
# - Versiones mayores (Node 24, Next 16, Prisma 7, Tailwind 4…): a mano.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-monthly:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  # Imagen base de node en deploy/containers/app.Containerfile.
  - package-ecosystem: docker
    directory: /deploy/containers
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Madrid
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-monthly:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Madrid
    groups:
      actions-monthly:
        patterns: ["*"]
